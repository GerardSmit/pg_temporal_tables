name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [18]
    env:
      PG_TEMPORAL_PG_VERSION: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} dev headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-${{ matrix.pg }} build-essential

      - name: Build (host smoke build)
        run: make -j"$(nproc)" PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Stage release tarball
        run: |
          make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config DESTDIR="$PWD/stage"
          VERSION=$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" pg_temporal_tables.control)
          tar -czf "pg_temporal_tables-${VERSION}-pg${{ matrix.pg }}-linux-amd64.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: pg_temporal_tables-pg${{ matrix.pg }}
          path: pg_temporal_tables-*-pg${{ matrix.pg }}-linux-amd64.tar.gz

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/pg_temporal_tables.sln -c Release
